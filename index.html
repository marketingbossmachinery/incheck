<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#18181b">
<title>Incheck prototype v14</title>
<style>
:root{--bg:#18181b;--panel:#27272a;--line:#3f3f46;--tx:#fafafa;--mute:#a1a1aa;--or:#f97316;--gr:#22c55e;--red:#ef4444;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:#09090b;color:var(--tx);font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.top{position:relative;padding:20px 76px 8px 20px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;color:var(--mute);margin:0 0 12px}
h2 small{font-weight:500;font-size:12px;margin-left:6px}
.body{flex:1;overflow-y:auto;padding:12px 20px}
.foot{padding:12px 20px 20px;background:var(--bg);border-top:1px solid var(--line)}
.foot .cta+.cta{margin-top:10px}
button{font:inherit;color:inherit;border:0;cursor:pointer;min-height:48px;border-radius:10px}
.cta{width:100%;min-height:56px;background:var(--or);color:#18181b;font-weight:800;font-size:17px;letter-spacing:.03em}
.cta:active{background:#ea580c}
.cta[disabled]{background:var(--line);color:var(--mute)}
.cta.sm{min-height:48px;font-size:14px}
.cta.alt{background:var(--panel);color:var(--tx)}
.btns{display:flex;gap:8px;margin:-4px 0 12px}
.new{width:100%;min-height:96px;background:#fb923c;color:#18181b;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:14px}
.new span{font-size:44px;line-height:1;font-weight:400}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);padding:10px;margin-bottom:10px;min-height:76px}
.th{width:76px;height:57px;border-radius:8px;background:#3f3f46 center/cover;flex:none;display:grid;place-items:center;color:var(--mute);font-weight:700;font-size:13px}
.card b{display:block;font-size:17px}.card small{color:var(--mute);font-size:13px;font-family:ui-monospace,Menlo,monospace}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.seg button{background:var(--panel);font-weight:700;border:2px solid transparent;min-height:56px;font-size:17px}
.seg button.on{border-color:var(--or);color:var(--or)}
/* BV/BM-nummer */
.idin{display:flex;align-items:stretch;min-height:60px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.idin:focus-within{border-color:var(--or)}
.idin span{display:grid;place-items:center;padding:0 16px;background:#3f3f46;color:var(--tx);font:700 22px ui-monospace,Menlo,monospace;letter-spacing:.06em}
.idin input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:500 22px ui-monospace,Menlo,monospace;letter-spacing:.14em;padding:0 14px}
.idin input::placeholder{color:#52525b}
.idin em{align-self:center;padding:0 14px;color:var(--mute);font-style:normal;font-size:13px}
.idin em.ok{color:var(--gr)}
/* snelle controle */
.chk{background:var(--panel);border-radius:12px;padding:14px 16px;margin:16px 0 12px}
.chk .st{margin:0 0 12px;font-weight:700;display:flex;align-items:center;gap:8px;font-size:15px}
.chk .st i{width:10px;height:10px;border-radius:50%;background:var(--mute);flex:none}
.chk .st.ok i{background:var(--gr)}
.chk.warn .st i{background:var(--or)}
.chk dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin:0;font-size:15px;align-items:baseline}
.chk dt{color:var(--mute)}
.chk dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.chk dd.mono{font-family:ui-monospace,Menlo,monospace;font-size:14px;letter-spacing:.03em}
.chk dd.no{color:var(--or);font-weight:500}
.plist ol{margin:0 0 14px;padding-left:24px;color:var(--mute);font-size:14px;line-height:1.7;columns:2;column-gap:18px}
/* formulier */
.row{display:grid;grid-template-columns:42% 1fr;align-items:center;gap:12px;margin-bottom:16px}
.row label{color:var(--or);font-weight:700;font-size:15px;line-height:1.25}
.row label.req::after{content:" *"}
.row label small{display:block;color:var(--mute);font-weight:500;font-size:11px;margin-top:2px}
.hint{display:none;grid-column:1/-1;color:var(--mute);font-size:13px;line-height:1.4;margin:-6px 0 4px}
.hint.on{display:block}
.fld{position:relative}
.fld input,.fld select,.big{width:100%;min-height:48px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;font-size:16px;padding:0 40px 0 12px}
.fld input[type=date]{padding-right:12px}
.big{padding:0 12px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em;margin-bottom:12px}
.big::placeholder,.fld input::placeholder{color:#52525b}
.fld svg{position:absolute;right:12px;top:15px;width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;pointer-events:none}
.sec{color:var(--mute);font-size:13px;font-weight:600;margin:24px 0 12px;padding-top:12px;border-top:1px solid var(--line)}
.note{color:var(--mute);font-size:14px;line-height:1.4;margin:0 0 16px}
.warn{background:#431407;border:1px solid var(--or);color:#fed7aa;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.45;margin:0 0 16px}
.vinbox{padding:14px 14px 4px;border:1px solid var(--line);border-radius:12px;margin-bottom:16px;background:#1f1f23}
.vinbox .note{margin:0 0 12px}
details.mod{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:#1f1f23}
details.mod>summary{list-style:none;padding:0 16px;min-height:52px;display:flex;justify-content:space-between;align-items:center;font-weight:700;cursor:pointer}
details.mod>summary::-webkit-details-marker{display:none}
.ar{display:inline-block;width:9px;height:9px;border-right:2.5px solid var(--or);border-bottom:2.5px solid var(--or);transform:rotate(-45deg);margin-right:14px;transition:transform .15s;position:relative;top:-1px}
details[open]>summary .ar{transform:rotate(45deg);top:-3px}
details.mod[open]>summary{border-bottom:1px solid var(--line);margin-bottom:14px}
details.mod .mb{padding:0 12px}
.cnt{font-size:13px;font-weight:600;color:var(--mute);white-space:nowrap}.cnt.ok{color:var(--gr)}
.cnt small{font-weight:500;color:var(--mute)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 16px;font-size:14px;color:var(--mute)}
.bar b{color:var(--tx)}
.tog{background:var(--panel);padding:0 14px;min-height:40px;font-size:13px;font-weight:600;border:2px solid transparent;white-space:nowrap}
.tog.on{border-color:var(--or);color:var(--or)}
pre.raw{white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.4;color:var(--mute);margin:0 0 12px;max-height:340px;overflow:auto;user-select:text;-webkit-user-select:text}
#back,#cfg{position:absolute;top:18px;right:16px;width:48px;height:48px;font-size:24px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
/* tegels: foto's en video's */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid>*{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;min-height:0;margin:0;width:100%}
.vg>*{aspect-ratio:16/9}
.ph{background:var(--panel);cursor:pointer}
.ph img,.ph video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ph span{position:absolute;left:0;right:0;bottom:0;background:#000b;font-size:12px;line-height:1.3;padding:5px 8px;text-align:left}
.ph.sel{outline:3px solid var(--or);outline-offset:-3px}
.grid i{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;background:var(--or);color:#18181b;font-style:normal;font-weight:800;display:grid;place-items:center;font-size:14px}
.sk{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:3px;text-align:left;padding:10px 12px;border:1px dashed var(--line);background:none;color:var(--mute);font-size:12px;line-height:1.3}
.sk b{color:var(--tx);font-size:13px;font-weight:600}
.sk.add b{color:var(--or);font-size:30px;line-height:1;font-weight:400}
.sk.add:active{border-color:var(--or)}
b.play{position:absolute;top:50%;left:50%;width:44px;height:44px;margin:-26px 0 0 -22px;border-radius:50%;background:#000a;display:grid;place-items:center}
b.play::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:4px}
.dash{border-top:2px dashed var(--line);margin:22px 0 12px;padding-top:12px;color:var(--mute);font-size:13px;font-weight:600}
/* vergroten en melding */
.lb{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(68px + env(safe-area-inset-top,0px)) 0 calc(20px + env(safe-area-inset-bottom,0px))}
.lb img,.lb video{max-width:100%;max-height:100%;width:100%;object-fit:contain;min-height:0;flex:0 1 auto;background:#000}
.lb .cap{color:var(--mute);margin:10px 16px 0;font-size:14px}
.mdl{position:fixed;inset:0;z-index:30;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px}
.mdl>div{background:var(--panel);border-radius:14px;padding:20px;width:100%;max-width:400px}
.mdl p{margin:0 0 18px;font-size:16px;line-height:1.45}
.mdl .cta+.cta{margin-top:10px}
.mdl .cta.alt{background:var(--line)}
/* camera */
.cam{position:fixed;inset:0;z-index:5;display:block;padding:0;background:#000}
.vf{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);height:100%;width:auto;aspect-ratio:4/3;max-width:100%;background:#111;overflow:hidden;display:grid;place-items:center}
.vf.w{aspect-ratio:16/9}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf video#vr{object-fit:contain;background:#000}
.vf .lbl{position:absolute;top:10px;left:10px;background:#000a;padding:6px 12px;border-radius:8px;font-weight:700;z-index:2}
.vf .sim{color:#71717a;text-align:center;padding:20px;z-index:1}
.side{position:absolute;top:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:84px}
.side:first-child{left:max(12px,env(safe-area-inset-left))}
.side:nth-child(3){right:max(12px,env(safe-area-inset-right))}
.shut{width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid var(--or);display:grid;place-items:center}
.shut svg{width:30px;stroke:#18181b;fill:none;stroke-width:2}
.rec{width:76px;height:76px;border-radius:50%;background:transparent;border:5px solid #fff;display:grid;place-items:center;padding:0}
.rec i{display:block;width:56px;height:56px;border-radius:50%;background:var(--red);transition:all .15s}
.rec.on i{width:28px;height:28px;border-radius:6px}
.skip{background:var(--panel);width:76px;font-weight:800}
.skip.wide{width:84px;padding:0 4px;font-size:12px;letter-spacing:.02em}
.skip.go{background:var(--or);color:#18181b}
.x{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right));width:48px;background:#000b;font-size:26px;z-index:3;color:#fff}
.lvl{position:absolute;left:12%;right:12%;bottom:14px;height:20px}
.lvl i{position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:#fff}
.lvl b{position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:#ffffffaa;transition:background .2s}
.lvl.ok b{background:var(--gr)}
.prog{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:#000a;padding:4px 10px;border-radius:8px;z-index:3;white-space:nowrap}
.prog.live{background:var(--red);font-weight:700}
@media (orientation:portrait){.cam{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:60px 0 24px}.vf{position:relative;top:auto;bottom:auto;left:auto;transform:none;height:auto;width:100%}.side{position:static;flex-direction:row;width:100%;justify-content:space-between;padding:0 16px}.side:first-child,.side:nth-child(3){left:auto;right:auto}.skip.wide{width:auto;min-width:150px;padding:0 18px;font-size:15px}}
.done{flex:1;display:grid;place-content:center;text-align:center;gap:20px}
.done svg{width:120px;stroke:var(--gr);fill:none;stroke-width:3;filter:drop-shadow(0 0 18px #22c55e99);margin:auto}
.done p{font-size:26px;font-weight:800;margin:0}
</style>
</head>

const num=(x,f=1)=>{let t=String(x==null?'':x).trim();if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t))t=t.replace(/,/g,'');const n=parseFloat(t.replace(',','.'));return isFinite(n)&&n>0?String(Math.round(n*f)):''};
const TC=s=>String(s||'').toLowerCase().replace(/(^|[\s\-\/])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
const nrm=s=>String(s).toLowerCase().replace(/\([^)]*\)/g,' ').replace(/[^a-z0-9]+/g,' ').trim();
const mapEn=v=>{v=String(v).toLowerCase();return /plug/.test(v)?'Plug-inhybride':/hybrid/.test(v)?'Hybride':/diesel/.test(v)?'Diesel':/petrol|gasoline|benzin/.test(v)?'Benzine':/electric|elektr/.test(v)?'Elektrisch':/cng|natural/.test(v)?'CNG':/lpg/.test(v)?'LPG':/hydrogen|waterstof/.test(v)?'Waterstof':/lng/.test(v)?'LNG':''};
const mapGb=v=>{v=String(v).toLowerCase();return /semi|robot|automated/.test(v)?'Geautomatiseerd handgeschakeld':/manual|hand/.test(v)?'Handgeschakeld':/auto|dsg|cvt|dual/.test(v)?'Automaat':''};
const mapDr=v=>{v=String(v).toLowerCase();return /front|fwd|voor/.test(v)?'Voorwiel':/rear|rwd|achter/.test(v)?'Achterwiel':/4|all|awd|four|vier/.test(v)?'Vierwiel / alle wielen':''};

// Vincario (alleen voor de test rechtstreeks vanuit de browser; sleutels staan op het toestel, zie Instellingen)
const cfgGet=()=>{try{return Object.assign({api:'',secret:''},JSON.parse(localStorage.getItem('incheck_vincario')||'{}'))}catch(e){return{api:'',secret:''}}};
const cfgSet=(api,secret)=>{try{localStorage.setItem('incheck_vincario',JSON.stringify({api,secret}))}catch(e){}};
async function sha1(s){const b=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function vinRows(vin){
 if(S.cache[vin])return S.cache[vin];
 const K=cfgGet();if(!K.api||!K.secret)return 'nokeys';
 const sum=(await sha1(vin+'|decode|'+K.api+'|'+K.secret)).slice(0,10);
 const r=await fetch('https://api.vincario.com/3.2/'+K.api+'/'+sum+'/decode/'+vin+'.json');
 if(!r.ok)return 'notfound';
 const j=await r.json(),rows=j.decode||[];if(!rows.length)return 'notfound';
 return S.cache[vin]=rows}
const COL_EN={white:'Wit',black:'Zwart',grey:'Grijs',gray:'Grijs',silver:'Zilver',blue:'Blauw',red:'Rood',green:'Groen',yellow:'Geel',orange:'Oranje',brown:'Bruin'};
// [veldcode, labelvarianten (genormaliseerd), soort]
const VM=[['ID_MAKE',['make'],'s'],['ID_MODEL',['model'],'s'],['ID_YEAR',['made'],'y'],['ID_MODELYEAR',['model year'],'n'],['ID_YEAR',['model year'],'n'],['ID_FIRSTREG',['registered'],'d'],
['DIM_COLOR',['color','colour'],'col'],['DIM_STEER',['steering'],'st'],
['DIM_LENGTH',['length'],'mm'],['DIM_WIDTH',['width'],'mm'],['DIM_HEIGHT',['height'],'mm'],['DIM_WHEELBASE',['wheelbase array','wheelbase'],'mm'],
['DIM_EMPTY',['weight empty'],'kg'],['DIM_GVW',['max weight','gross vehicle weight'],'kg'],['DIM_TOWUNBRAKED',['permitted trailer load without brakes'],'kg'],['DIM_TOWBRAKED',['permitted trailer load with brakes'],'kg'],
['DIM_SEATS',['number of seats','seats'],'n'],['DIM_DOORS',['number of doors','doors'],'n'],
['ENG_ENERGY',['fuel type primary'],'en'],['ENG_POWER',['engine power','power'],'kw'],['ENG_MODEL',['engine code','engine model'],'s'],['ENG_GEARBOX',['transmission','gearbox'],'gb'],['ENG_GEARS',['number of gears'],'n'],['ENG_DRIVE',['drive'],'dr'],
['ICE_CC',['engine displacement'],'n'],['ICE_CYL',['engine cylinders','number of cylinders','cylinders'],'n'],['ICE_EURO',['emission standard'],'s'],['ICE_TANK',['fuel capacity','fuel tank capacity'],'n'],['ICE_CO2',['co2 emission'],'n'],['ICE_CONS',['fuel consumption combined'],'f']];
const VMM=[['merk',['make'],'s'],['model',['model'],'s'],['bouwjaar',['made'],'y'],['bouwjaar',['model year'],'n'],['brandstof',['fuel type primary'],'en'],['motor_type',['engine code','engine model'],'s'],['cilinders',['engine cylinders','number of cylinders'],'n'],['gewicht',['weight empty'],'kgt'],['vermogen',['engine power'],'kwt']];
function applyVin(rows){S.raw.vincario=rows;
 const R=rows.map(r=>({n:nrm(r.label),u:((r.label.match(/\(([^)]*)\)/)||[])[1]||'').toLowerCase(),v:Array.isArray(r.value)?r.value[0]:r.value}));
 const find=al=>{for(const a of al){const m=R.filter(r=>r.n===a&&r.v!=null&&r.v!=='');if(m.length)return m}return[]};
 const kwv=m=>{const k=m.find(x=>x.u==='kw');return k?num(k.v):num(m[0].v,{hp:.7355,ps:.7355,pk:.7355,bhp:.7355}[m[0].u]||1)};
 const K={s:m=>String(m[0].v).trim(),n:m=>num(m[0].v),f:m=>{const n=parseFloat(String(m[0].v).replace(',','.'));return isFinite(n)&&n>0?String(Math.round(n*10)/10):''},
  y:m=>{const x=String(m[0].v).slice(0,4);return /^(19|20)\d\d$/.test(x)?x:''},d:m=>{const x=String(m[0].v).slice(0,10);return /^\d{4}-\d{2}-\d{2}$/.test(x)?x:''},
  mm:m=>num(m[0].v,{mm:.1,cm:1,m:100,in:2.54}[m[0].u]||.1),kg:m=>num(m[0].v,{kg:1,lb:.4536,lbs:.4536,t:1000,g:.001}[m[0].u]||1),
  kw:kwv,en:m=>mapEn(m[0].v),gb:m=>mapGb(m[0].v),dr:m=>mapDr(m[0].v),
  col:m=>{const v=String(m[0].v).toLowerCase(),k=Object.keys(COL_EN).find(x=>v.includes(x));return k?COL_EN[k]:''},
  st:m=>{const v=String(m[0].v).toLowerCase();return /left/.test(v)?'Links':/right/.test(v)?'Rechts':/cent|mid/.test(v)?'Midden':''},
  kgt:m=>{const n=num(m[0].v);return n?n+' kg':''},kwt:m=>{const n=kwv(m);return n?n+' kW':''}};
 (S.type==='van'?VM:VMM).forEach(([c,al,k])=>{const m=find(al);if(m.length)put(c,K[k](m),'Vincario')});
 if(S.type==='van'){

 const live=()=>{vr.pause();vr.removeAttribute('src');vr.style.display='none';v.style.display='';$('#vre').hidden=true;$('#vok').hidden=true;$('#vback').hidden=false;rb.hidden=false;vt.textContent='16:9 · 0:00';vt.classList.remove('live')};
 const review=(blob,dur)=>{cur={url:blob?URL.createObjectURL(blob):null,dur,mime:blob?blob.type:''};
  v.style.display='none';if(cur.url){vr.src=cur.url;vr.style.display='';sim.style.display='none'}else{sim.style.display='';sim.innerHTML='Demo-video opgenomen ('+fmt(dur)+').<br>Geen beeld beschikbaar in deze preview.'}
  rb.hidden=true;$('#vback').hidden=true;$('#vre').hidden=false;$('#vok').hidden=false;vt.classList.remove('live');vt.textContent='Video · '+fmt(dur)};
 rb.onclick=()=>{
  if(!S.rec){// start
   t0=Date.now();rb.classList.add('on');rb.setAttribute('aria-label','Opname stoppen');vt.classList.add('live');vt.textContent='● 0:00';
   S.vtick=setInterval(()=>{vt.textContent='● '+fmt((Date.now()-t0)/1000)},250);
   if(stream&&window.MediaRecorder){const ch=[];let r;try{r=new MediaRecorder(stream,mime?{mimeType:mime}:undefined)}catch(e){r=new MediaRecorder(stream)}
    r.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
    r.onstop=()=>review(ch.length?new Blob(ch,{type:r.mimeType||mime||'video/mp4'}):null,(Date.now()-t0)/1000);
    r.start(250);S.rec=r}
   else S.rec={fake:1};
  }else{// stop
   clearInterval(S.vtick);rb.classList.remove('on');rb.setAttribute('aria-label','Opname starten');
   const r=S.rec;S.rec=null;if(r.fake)review(null,(Date.now()-t0)/1000);else r.stop()}};
 $('#vre').onclick=()=>{if(cur&&cur.url)URL.revokeObjectURL(cur.url);cur=null;live()};
 $('#vok').onclick=()=>{if(cur)S.videos.push(cur);cur=null;go('s3')};
 const leave=()=>{if((S.rec||cur)&&!confirm('Video niet bewaren?'))return;if(cur&&cur.url)URL.revokeObjectURL(cur.url);cur=null;go('s3')};
 $('#vback').onclick=leave;$('#x').onclick=leave;
}
const cfgCam=s=>s.getVideoTracks().some(t=>!/canvas/i.test(t.label||''));

const BACK={
 s1:()=>go('home'),
 s3:()=>{const n=S.seq.length;S.photos.pop();S.i=S.photos.length>=n?-1:S.photos.length;go('cam')},
 s4:()=>go('s3'),
 ad:()=>go('s4'),
 order:()=>{S.ad.fotos=S.ofotos||S.ad.fotos;go('ad')},
 cfg:()=>go('home')
};
function addBack(){const t=app.querySelector('.top'),f=BACK[S.step];if(!t||!f)return;t.insertAdjacentHTML('beforeend','<button id="back" aria-label="Terug">←</button>');$('#back').onclick=f}
draw();
</script>
</body>
