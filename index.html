<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Incheck prototype</title>
<style>
:root{--bg:#18181b;--panel:#27272a;--line:#3f3f46;--tx:#fafafa;--mute:#a1a1aa;--or:#f97316;--gr:#22c55e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#09090b;color:var(--tx);font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.top{padding:20px 20px 8px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;color:var(--mute);margin:0 0 12px}
.body{flex:1;overflow-y:auto;padding:12px 20px}
.foot{padding:12px 20px 20px;background:var(--bg);border-top:1px solid var(--line)}
button{font:inherit;color:inherit;border:0;cursor:pointer;min-height:48px;border-radius:10px}
.cta{width:100%;min-height:56px;background:var(--or);color:#18181b;font-weight:800;font-size:17px;letter-spacing:.03em}
.cta:active{background:#ea580c}
.cta[disabled]{background:var(--line);color:var(--mute)}
.new{width:100%;min-height:96px;background:#fb923c;color:#18181b;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:14px}
.new span{font-size:44px;line-height:1;font-weight:400}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);padding:10px;margin-bottom:10px;min-height:76px}
.th{width:76px;height:57px;border-radius:8px;background:#3f3f46 center/cover;flex:none;display:grid;place-items:center;color:var(--mute);font-weight:700;font-size:13px}
.card b{display:block;font-size:17px}.card small{color:var(--mute);font-size:13px;font-family:ui-monospace,Menlo,monospace}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.seg button{background:var(--panel);font-weight:700;border:2px solid transparent}
.seg button.on{border-color:var(--or);color:var(--or)}
.row{display:grid;grid-template-columns:42% 1fr;align-items:center;gap:12px;margin-bottom:16px}
.row label{color:var(--or);font-weight:700;font-size:15px}
.fld{position:relative}
.fld input,.fld select,.big{width:100%;min-height:48px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;font-size:16px;padding:0 40px 0 12px}
.big{padding:0 12px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em;margin-bottom:12px}
.big::placeholder{color:#52525b}
.fld svg{position:absolute;right:12px;top:15px;width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;pointer-events:none}
.sec{color:var(--mute);font-size:13px;font-weight:600;margin:24px 0 12px;padding-top:12px;border-top:1px solid var(--line)}
.note{color:var(--mute);font-size:14px;line-height:1.4;margin:0 0 16px}
/* camera */
.cam{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,0) 12px;gap:12px;flex-direction:row}
.vf{position:relative;flex:1;aspect-ratio:4/3;max-height:100%;max-width:100%;background:#111;overflow:hidden;border-radius:8px;display:grid;place-items:center}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf .lbl{position:absolute;top:10px;left:10px;background:#000a;padding:6px 12px;border-radius:8px;font-weight:700}
.vf .sim{color:#52525b;text-align:center;padding:20px}
.side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:84px;flex:none}
.shut{width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid var(--or);display:grid;place-items:center}
.shut svg{width:30px;stroke:#18181b;fill:none;stroke-width:2}
.skip{background:var(--panel);width:76px;font-weight:800}
.x{position:absolute;top:calc(10px + env(safe-area-inset-top,0));right:10px;width:48px;background:#000b;font-size:26px;z-index:3}
.lvl{position:absolute;left:12%;right:12%;bottom:14px;height:20px}
.lvl i{position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:#fff}
.lvl b{position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:#ffffffaa;transition:background .2s}
.lvl.ok b{background:var(--gr)}
.prog{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:#000a;padding:4px 10px;border-radius:8px}
@media (orientation:portrait){.cam{flex-direction:column;justify-content:center;padding-top:60px}.vf{flex:none;width:100%}.side{flex-direction:row;width:100%;justify-content:space-between;padding:0 8px}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid div{position:relative;aspect-ratio:4/3;background:var(--panel);border-radius:8px;overflow:hidden}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid span{position:absolute;left:0;right:0;bottom:0;background:#000b;font-size:12px;padding:4px 8px}
.grid .sk{display:grid;place-items:center;color:var(--mute);font-size:13px;border:1px dashed var(--line);background:none}
.done{flex:1;display:grid;place-content:center;text-align:center;gap:20px}
.done svg{width:120px;stroke:var(--gr);fill:none;stroke-width:3;filter:drop-shadow(0 0 18px #22c55e99);margin:auto}
.done p{font-size:26px;font-weight:800;margin:0}
.fld input::placeholder{color:#52525b}
.grid .sel{outline:3px solid var(--or);outline-offset:-3px}
.grid i{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;background:var(--or);color:#18181b;font-style:normal;font-weight:800;display:grid;place-items:center;font-size:14px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const PEN='<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>';
const FV=[['vin','#V'],['merk','Merk'],['type','Type'],['model','Model'],['categorie','Categorie'],['eerste_registratie','Eerste registratie'],['kleur','Kleur'],['tellerstand','#T'],['btw_marge','BTW / marge'],['conditie','Conditie'],['brandstof','Brandstof'],
['S','Afmetingen'],['lengte','Lengte'],['breedte','Breedte'],['hoogte','Hoogte'],['wielbasis','Wielbasis'],
['S','Gewichten'],['gvw','Max. gewicht'],['ledig','Ledig gewicht'],['laad','Laadvermogen'],['trek','Trekgewicht'],
['S','Motor en techniek'],['bak','Versnellingsbak'],['pk','Vermogen'],['euro','Emissieklasse'],['adblue','AdBlue','b'],
['S','Opties'],['airco','Airco','b'],['cam','Achteruitrijcamera','b'],['cruise','Cruise control','b'],['lat','Lat-betimmering','b']];
const F=FV;
const FM=[['chassisnummer','Chassisnummer'],['categorie','Categorie'],['subcategorie','Subcategorie'],['merk','Merk'],['type','Type'],['sector','Sector'],['voortbeweging','Voortbeweging'],['chassis_type','Chassis type'],['conditie','Conditie'],['bouwjaar','Bouwjaar'],['draaiuren','Draaiuren'],['kilometerstand','Kilometerstand'],['kenteken','Kenteken'],['locatie','Locatie'],['S','Specificaties'],['gewicht','Gewicht'],['t_lengte','Transport lengte'],['t_breedte','Transport breedte'],['t_hoogte','Transport hoogte'],['t_notities','Transport notities'],['motor_merk','Motor merk'],['brandstof','Brandstof'],['motor_type','Motor type'],['cilinders','Aantal cilinders'],['vermogen','Vermogen'],['ce','Heeft CE?','b'],['epa','Heeft EPA?','b'],['banden','Banden configuratie'],['S','Rijwerk'],['sprocket','Sprocket'],['platen','Platen'],['ketting','Ketting'],['plaatwijdte','Plaatwijdte']];
const EX={chassisnummer:'CAT0320GC12345',categorie:'Graafmachines',subcategorie:'Rupsgraafmachines',merk:'Caterpillar',type:'320 GC',sector:'Grond-, weg- en waterbouw',voortbeweging:'Rupsen',chassis_type:'Rupsonderstel',conditie:'Gebruikt',bouwjaar:'2019',draaiuren:'4250',kilometerstand:'0',gewicht:'22000 kg',t_lengte:'950 cm',t_breedte:'280 cm',t_hoogte:'300 cm',motor_merk:'Cat',brandstof:'Diesel',motor_type:'C4.4',cilinders:'4',vermogen:'121 PK',banden:'Rupsen',plaatwijdte:'600 mm'};
const PH=()=>S.type==='van'?MOCK:EX;
const fl=()=>S.type==='van'?FV:FM;
const MOCK={vin:'WMA03VUY6P9019536',merk:'MAN',type:'TGE 3.140 2.0 TDI',model:'L3H3',categorie:'Gesloten bestelbus',eerste_registratie:'03-04-2023',kleur:'Wit',eenheid:'km',tellerstand:'145964',btw_marge:'BTW',conditie:'Gebruikt',brandstof:'Diesel',lengte:'615 cm',breedte:'204 cm',hoogte:'255 cm',wielbasis:'364 cm',gvw:'3500 kg',ledig:'2040 kg',laad:'1460 kg',trek:'2500 kg',bak:'Automaat',pk:'140 PK',euro:'Euro 6',adblue:'Ja',airco:'Ja',cam:'Ja',cruise:'Ja',lat:'Ja'};
const EXT=['Rechtsvoor','Rechts','Rechtsachter','Achter','Linksachter','Links','Linksvoor','Voor'];
const SEQ={van:[...EXT,'Dashboard','Voorstoelen','Achterbank','Tellerstand (motor draait)','Infotainment','Middenconsole','Stuurwiel','Laadruimte achter','Laadruimte opzij','Vloer en wandbekleding','Tussenschot','Linksvoor velg en bandenprofiel','Motorruimte','Opties','Schades'],
machine:[...EXT,'Cabine','Bedieningspaneel','Urenteller (motor draait)','Motorruimte','Werktuig / bak','Rupsen of banden','Opties','Schades']};
const S={step:'home',type:'van',id:'',d:{},ad:{},photos:[],i:0,stream:null,
 sessions:[['MAN TGE','BV007963',{merk:'MAN',type:'TGE'}],['Mercedes-Benz Sprinter','BV007958',{merk:'Mercedes-Benz',type:'Sprinter'}],['Ford Transit','BV007941',{merk:'Ford',type:'Transit'}],['VW Crafter','BV007902',{merk:'VW',type:'Crafter'}]].map(([t,id,o])=>({title:t,id,type:'van',d:{...MOCK,...o},photos:[]}))};

// Mock van /api/vehicles/lookup
async function lookup(type,id){await new Promise(r=>setTimeout(r,500));return type==='van'?{...MOCK,vin:''}:Object.fromEntries([...F.filter(f=>f[0]!=='S').map(f=>[f[0],f[2]?'Nee':'']),['eenheid','uur']]);}

function form(){return fl().map(([k,l,t])=>{
 if(k==='S')return `<div class="sec">${l}</div>`;
 if(l==='#T')l=S.d.eenheid==='uur'?'Bedrijfsuren':'Tellerstand (km)';
 if(k==='vin')l='VIN-nummer';
 const inp=t==='b'?`<select data-k="${k}">${['','Ja','Nee'].map(o=>`<option value="${o}"${(S.d[k]||'')===o?' selected':''}>${o||'–'}</option>`).join('')}</select>`:`<input data-k="${k}" placeholder="${(PH()[k]||'').replace(/"/g,'&quot;')}" value="${(S.d[k]||'').replace(/"/g,'&quot;')}" ${k==='tellerstand'?'inputmode="numeric"':''}>`;
 return `<div class="row"><label>${l}</label><div class="fld">${inp}${t==='b'?'':PEN}</div></div>${k==='vin'||k==='chassisnummer'?'<div style="display:flex;gap:8px;margin:-4px 0 20px"><button class="cta" data-scan style="min-height:48px;font-size:14px;background:var(--panel);color:var(--tx)">SCAN MET CAMERA</button>'+(k==='vin'?'<button class="cta" data-lookup style="min-height:48px;font-size:14px">GEGEVENS OPHALEN</button>':'')+'</div>':''}`}).join('')}
app.addEventListener('input',e=>{const k=e.target.dataset.k;if(k)S.d[k]=e.target.value;const a=e.target.dataset.a;if(a)S.ad[a]=e.target.value});
app.addEventListener('change',e=>{const k=e.target.dataset.k;if(k)S.d[k]=e.target.value;const a=e.target.dataset.a;if(a)S.ad[a]=e.target.value});
app.addEventListener('click',async e=>{const t=e.target;
 if(t.dataset.scan!==undefined){scanVin();return}
 if(t.dataset.lookup!==undefined){t.textContent='OPHALEN...';await fill();draw();return}
 const p=t.closest('[data-p]');if(p){const n=+p.dataset.p,a=S.ad.fotos,j=a.indexOf(n);j<0?a.push(n):a.splice(j,1);$('#agrid').innerHTML=agrid()}});
function reqMotion(){try{const D=window.DeviceMotionEvent;if(D&&typeof D.requestPermission==='function')return D.requestPermission().then(r=>{S.motion=r}).catch(()=>{S.motion='denied'});S.motion='granted'}catch(e){S.motion='denied'}return Promise.resolve()}
const tl=p=>p.tilt==null?'':Math.abs(p.tilt)<1.2?' <b style="color:var(--gr)">✓ recht</b>':' <b style="color:var(--or)">'+Math.abs(p.tilt).toFixed(1)+'° scheef</b>';
function scanVin(){
 const ov=document.createElement('div');let r,done=false;
 ov.style.cssText='position:absolute;inset:0;z-index:9;background:#000;display:flex;flex-direction:column';
 ov.innerHTML=`<div style="position:relative;flex:1;overflow:hidden"><video id="sv" playsinline muted style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;left:8%;right:8%;top:38%;height:24%;border:3px solid var(--or);border-radius:12px"></div><p id="svm" style="position:absolute;left:16px;right:16px;bottom:16px;margin:0;text-align:center;background:#000b;padding:10px;border-radius:10px">Richt de camera op de barcode van het ${S.type==='van'?'VIN':'chassisnummer'}.</p></div><div class="foot"><button class="cta" id="svx" style="background:var(--panel);color:var(--tx)">ANNULEREN</button></div>`;
 app.appendChild(ov);
 const close=()=>{try{r&&r.reset()}catch(e){}ov.remove()};
 $('#svx').onclick=close;
 const ok=async txt=>{if(done)return;done=true;close();if(S.type==='van'){S.d.vin=txt;await fill()}else S.d.chassisnummer=txt;draw()};
 const fail=e=>{const m=$('#svm');if(!m)return;m.innerHTML='Camera of scanner niet beschikbaar ('+(e&&e.name||e)+').<br>Typ het nummer in of gebruik de demo.';ov.querySelector('.foot').insertAdjacentHTML('afterbegin','<button class="cta" id="svd" style="margin-bottom:8px">DEMO-WAARDE INVULLEN</button>');$('#svd').onclick=()=>ok(S.type==='van'?'WMA03VUY6P9019536':'CAT0320GC12345')};
 try{
  const Z=window.ZXing,h=new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.DATA_MATRIX,Z.BarcodeFormat.QR_CODE]);h.set(Z.DecodeHintType.TRY_HARDER,true);
  r=new Z.BrowserMultiFormatReader(h);
  r.decodeFromConstraints({video:{facingMode:'environment',width:{ideal:1920}}},'sv',res=>{if(!res)return;const raw=res.getText();if(S.type==='van'){const m=raw.toUpperCase().replace(/[^A-Z0-9]/g,'').match(/[A-HJ-NPR-Z0-9]{17}/);if(m)ok(m[0]);else{const x=$('#svm');if(x)x.textContent='Geen geldig VIN gelezen, probeer opnieuw.'}}else ok(raw.trim())}).catch(fail);
 }catch(e){fail(e)}
}
async function fill(){if(!S.d.vin)S.d.vin=MOCK.vin;const r=await lookup('van',S.d.vin);Object.entries(r).forEach(([k,v])=>{if(!S.d[k])S.d[k]=v})}
function agrid(){const ps=S.photos.map((p,n)=>[p,n]).filter(x=>x[0].url);return ps.length?ps.map(([p,n])=>{const j=S.ad.fotos.indexOf(n);return `<div data-p="${n}" class="${j>=0?'sel':''}"><img src="${p.url}">${j>=0?`<i>${j+1}</i>`:''}<span>${p.label}</span></div>`}).join(''):`<p class="note">Geen foto's in deze sessie.</p>`}
function adscreen(){const A=S.ad;if(!A.fotos)A.fotos=S.photos.map((p,n)=>p.url?n:-1).filter(n=>n>=0).slice(0,8);
 const yn=k=>`<select data-a="${k}">${['Nee','Ja'].map(o=>`<option${(A[k]||'Nee')===o?' selected':''}>${o}</option>`).join('')}</select>`;
 app.innerHTML=`<div class="scr"><div class="top"><h1>Adverteren</h1></div><div class="body"><div class="row"><label>Internetprijs (€)</label><div class="fld"><input data-a="prijs" inputmode="numeric" placeholder="24950" value="${A.prijs||''}">${PEN}</div></div><div class="row"><label>URL</label><div class="fld"><input data-a="url" placeholder="https://…" value="${A.url||''}">${PEN}</div></div><div class="sec">Foto's website</div><p class="note">Tik de foto's aan die op de website komen. De eerste 8 zijn alvast gekozen; het cijfer is de volgorde.</p><div class="grid" id="agrid">${agrid()}</div><div class="sec">Publicatie</div><div class="row"><label>Publicatie website</label><div class="fld">${yn('publicatie')}</div></div><div class="row"><label>Binnenkort beschikbaar</label><div class="fld">${yn('binnenkort')}</div></div></div><div class="foot"><button class="cta" id="fin2">BEVESTIG EN VOLTOOI</button></div></div>`}

function go(s){stopCam();S.step=s;draw()}
function stopCam(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}clearInterval(S.lv);window.removeEventListener('devicemotion',S.ori)}

function draw(){
 if(S.step==='home')app.innerHTML=`<div class="scr"><div class="top"><h1>Incheck</h1></div><div class="body"><button class="new" id="new"><span>+</span>NIEUW VOERTUIG</button><h2 style="margin-top:28px">VORIGE SESSIES</h2>${S.sessions.map((s,n)=>`<button class="card" data-n="${n}"><div class="th" style="${s.photos[0]?`background-image:url(${s.photos[0].url})`:''}">${s.photos[0]?'':s.title.split(' ')[0].slice(0,3)}</div><div><b>${s.title}</b><small>${s.id}</small></div></button>`).join('')}</div></div>`,
  $('#new').onclick=()=>{S.d={};S.ad={};S.id='';S.photos=[];S.i=0;S.edit=null;go('s1')},
  app.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const s=S.sessions[c.dataset.n];Object.assign(S,{type:s.type,id:s.id,d:{...s.d},photos:[...s.photos],ad:{...(s.ad||{}),fotos:s.ad&&s.ad.fotos?[...s.ad.fotos]:undefined},edit:+c.dataset.n});go('s4')});
 else if(S.step==='s1'){
  app.innerHTML=`<div class="scr"><div class="top"><h1>Voertuig vastleggen</h1></div><div class="body"><div class="seg"><button data-t="van" class="${S.type==='van'?'on':''}">Bedrijfswagen (Van)</button><button data-t="machine" class="${S.type==='machine'?'on':''}">Machine (Machinery)</button></div>
  <h2 style="margin:0 0 8px">${S.type==='van'?'BV-nummer':'BM-nummer'}</h2><input class="big" id="id" placeholder="${S.type==='van'?'BV007963':'BM007963'}" value="${S.id}" autocapitalize="characters" maxlength="8">
  
  <p class="note">Voer het ${S.type==='van'?'BV':'BM'}-nummer in, of laat leeg voor een demo. De voertuiggegevens vul je pas na de fotosessie in. Bij een Van worden ze opgezocht met het VIN.</p>
  </div>
  <div class="foot"><button class="cta" id="go">START FOTOSESSIE</button></div></div>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.type=b.dataset.t;S.d={};S.id='';draw()});
  $('#id').oninput=e=>S.id=e.target.value;
  
  $('#go').onclick=()=>{reqMotion();S.id=(S.id||(S.type==='van'?'BV007963':'BM007963')).toUpperCase();S.i=0;S.photos=[];go('cam')};
 }
 else if(S.step==='cam')cam();
 else if(S.step==='s3'){
  const seq=SEQ[S.type];
  app.innerHTML=`<div class="scr"><div class="top"><h1>Foto-overzicht</h1><p class="note" style="margin:6px 0 0">${S.photos.filter(p=>p.url).length} foto's gemaakt, ${S.photos.filter(p=>p.tilt!=null&&Math.abs(p.tilt)<1.2).length} recht</p></div><div class="body"><div class="grid">${S.photos.map(p=>p.url?`<div><img src="${p.url}"><span>${p.label}${tl(p)}</span></div>`:`<div class="sk">${p.label}<br>overgeslagen</div>`).join('')}</div></div>
  <div class="foot"><button class="cta" id="more" style="background:var(--panel);color:var(--tx);margin-bottom:10px">+ EXTRA FOTO</button><button class="cta" id="fin">VOLTOOI FOTOSESSIE</button></div></div>`;
  $('#more').onclick=()=>{reqMotion();S.i=-1;go('cam')};$('#fin').onclick=()=>go('s4');
 }
 else if(S.step==='s4'){
  app.innerHTML=`<div class="scr"><div class="top"><h1>Gegevens controleren</h1></div><div class="body">${form()}</div><div class="foot"><button class="cta" id="ok">BEVESTIG GEGEVENS</button></div></div>`;
  $('#ok').onclick=()=>go('ad');
 }
 else if(S.step==='ad'){
  adscreen();
  $('#fin2').onclick=()=>{const t=`${S.d.merk||'Onbekend'} ${S.d.type||''}`.trim(),rec={title:t,id:S.id||'-',type:S.type,d:{...S.d},photos:S.photos.filter(p=>p.url),ad:{...S.ad,fotos:(S.ad.fotos||[]).map(n=>S.photos.slice(0,n).filter(p=>p.url).length)}};
   if(S.edit!=null&&S.edit>=0)S.sessions[S.edit]=rec;else S.sessions.unshift(rec);go('s5')};
 }
 else if(S.step==='s5'){
  app.innerHTML=`<div class="done"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.5 3.5L17 9"/></svg><p>Sessie voltooid</p></div>`;
  setTimeout(()=>S.step==='s5'&&go('home'),2000);
 }
}

async function cam(){
 const seq=SEQ[S.type],extra=S.i===-1,label=extra?'Extra foto':seq[S.i];
 app.innerHTML=`<div class="cam"><div class="side"><button class="skip" id="skip">${extra?'TERUG':'SKIP'}</button></div><div class="vf" id="vf"><video id="v" playsinline muted autoplay></video><div class="sim" id="sim">Camera niet beschikbaar in deze preview.<br>De sluiter maakt een demo-foto.</div><div class="lbl">${label}</div>${typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission&&S.motion!=='granted'?'<button id="mot" class="cta" style="position:absolute;left:12%;right:12%;bottom:44px;min-height:44px;width:auto;font-size:14px">WATERPAS ACTIVEREN</button>':''}<div class="lvl" id="lvl"><span id="lst" style="position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:12px;background:#000a;padding:2px 8px;border-radius:6px;white-space:nowrap"></span><i></i><b id="lb"></b></div></div><div class="side"><button class="shut" id="shut" aria-label="Foto maken"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button></div><button class="x" id="x">✕</button>${extra?'':`<div class="prog">${S.i+1} / ${seq.length}</div>`}</div>`;
 const v=$('#v');
 try{S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1440}},audio:false});v.srcObject=S.stream;$('#sim').style.display='none'}catch(e){v.style.display='none';$('#sim').innerHTML='Camera geblokkeerd ('+(e.name||e)+').<br>De sluiter maakt een demo-foto.'}
 // waterpas: echte sensor als die data geeft, anders demo-beweging
 let ang=null,pit=false;S.ori=e=>{const g=e.accelerationIncludingGravity;if(!g||g.x==null||g.y==null)return;S.live=Date.now();const n=Math.hypot(g.x,g.y,g.z||0)||1;pit=Math.abs((g.z||0)/n)>.5;const a0=Math.atan2(g.x,g.y)*180/Math.PI;ang=a0-Math.round(a0/90)*90};
 window.addEventListener('devicemotion',S.ori);$('#lvl').onclick=()=>{S.flip=!S.flip};const mb=$('#mot');if(mb)mb.onclick=async()=>{await reqMotion();mb.remove()};
 let t=0;S.lv=setInterval(()=>{t+=.1;const live=S.live&&Date.now()-S.live<500,a=live?(ang||0)*(S.flip?-1:1):Math.sin(t*.7)*6*Math.max(0,1-(t%12)/10);S.tilt=live&&!pit?a:null;
  $('#lb').style.transform=`rotate(${Math.max(-12,Math.min(12,a))}deg)`;$('#lb').style.opacity=live&&pit?.3:1;$('#lvl').classList.toggle('ok',!!live&&!pit&&Math.abs(a)<1.2);const st=$('#lst');if(st)st.textContent=!live?'geen sensor':pit?'houd horizontaal':(Math.abs(a)<1.2?'recht':a.toFixed(1)+'°')},60);
 $('#x').onclick=()=>{if(confirm('Sessie annuleren? Gemaakte foto\'s gaan verloren.'))go('home')};
 const next=p=>{if(extra){S.photos.push(p);go('s3');return}S.photos.push(p);S.i++;S.i>=seq.length?go('s3'):cam()};
 $('#skip').onclick=()=>extra?go('s3'):(stopCam(),next({label}));
 $('#shut').onclick=()=>{const c=document.createElement('canvas');c.width=1600;c.height=1200;const g=c.getContext('2d');
  if(S.stream&&v.videoWidth){const vw=v.videoWidth,vh=v.videoHeight,w=Math.min(vw,vh*4/3),h=w*3/4;g.drawImage(v,(vw-w)/2,(vh-h)/2,w,h,0,0,1600,1200)}
  else{g.fillStyle=`hsl(${S.photos.length*37%360} 12% 22%)`;g.fillRect(0,0,1600,1200);g.fillStyle='#fff8';g.font='bold 80px sans-serif';g.textAlign='center';g.fillText(label,800,620)}
  const url=c.toDataURL('image/jpeg',.8),tilt=S.tilt;stopCam();next({label,url,tilt})};
}
draw();
</script>
