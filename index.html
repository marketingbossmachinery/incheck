<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#18181b">
<title>Incheck prototype</title>
<style>
:root{--bg:#18181b;--panel:#27272a;--line:#3f3f46;--tx:#fafafa;--mute:#a1a1aa;--or:#f97316;--gr:#22c55e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:#09090b;color:var(--tx);font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;overscroll-behavior:none}
#app{height:100%;max-width:480px;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
.scr{flex:1;display:flex;flex-direction:column;min-height:0}
.top{position:relative;padding:20px 76px 8px 20px}
h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.01em}
h2{font-size:15px;font-weight:600;color:var(--mute);margin:0 0 12px}
.body{flex:1;overflow-y:auto;padding:12px 20px}
.foot{padding:12px 20px 20px;background:var(--bg);border-top:1px solid var(--line)}
button{font:inherit;color:inherit;border:0;cursor:pointer;min-height:48px;border-radius:10px}
.cta{width:100%;min-height:56px;background:var(--or);color:#18181b;font-weight:800;font-size:17px;letter-spacing:.03em}
.cta:active{background:#ea580c}
.cta[disabled]{background:var(--line);color:var(--mute)}
.cta.sm{min-height:48px;font-size:14px}
.cta.alt{background:var(--panel);color:var(--tx)}
.btns{display:flex;gap:8px;margin:-4px 0 20px}
.new{width:100%;min-height:96px;background:#fb923c;color:#18181b;font-size:22px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:14px}
.new span{font-size:44px;line-height:1;font-weight:400}
.card{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--panel);padding:10px;margin-bottom:10px;min-height:76px}
.th{width:76px;height:57px;border-radius:8px;background:#3f3f46 center/cover;flex:none;display:grid;place-items:center;color:var(--mute);font-weight:700;font-size:13px}
.card b{display:block;font-size:17px}.card small{color:var(--mute);font-size:13px;font-family:ui-monospace,Menlo,monospace}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.seg button{background:var(--panel);font-weight:700;border:2px solid transparent}
.seg button.on{border-color:var(--or);color:var(--or)}
.row{display:grid;grid-template-columns:42% 1fr;align-items:center;gap:12px;margin-bottom:16px}
.row label{color:var(--or);font-weight:700;font-size:15px;line-height:1.25}
.row label.req::after{content:" *"}
.row label small{display:block;color:var(--mute);font-weight:500;font-size:11px;margin-top:2px}
.hint{display:none;grid-column:1/-1;color:var(--mute);font-size:13px;line-height:1.4;margin:-6px 0 4px}
.hint.on{display:block}
.fld{position:relative}
.fld input,.fld select,.big{width:100%;min-height:48px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;font-size:16px;padding:0 40px 0 12px}
.fld input[type=date]{padding-right:12px}
.big{padding:0 12px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em;margin-bottom:12px}
select.big{font-family:inherit;letter-spacing:0}
.big::placeholder,.fld input::placeholder{color:#52525b}
.fld svg{position:absolute;right:12px;top:15px;width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2;pointer-events:none}
.sec{color:var(--mute);font-size:13px;font-weight:600;margin:24px 0 12px;padding-top:12px;border-top:1px solid var(--line)}
.note{color:var(--mute);font-size:14px;line-height:1.4;margin:0 0 16px}
details.mod{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:#1f1f23}
details.mod>summary{list-style:none;padding:0 16px;min-height:52px;display:flex;justify-content:space-between;align-items:center;font-weight:700;cursor:pointer}
details.mod>summary::-webkit-details-marker{display:none}
.ar{display:inline-block;width:9px;height:9px;border-right:2.5px solid var(--or);border-bottom:2.5px solid var(--or);transform:rotate(-45deg);margin-right:14px;transition:transform .15s;position:relative;top:-1px}
details[open]>summary .ar{transform:rotate(45deg);top:-3px}
details.mod[open]>summary{border-bottom:1px solid var(--line);margin-bottom:14px}
details.mod .mb{padding:0 12px}
.cnt{font-size:13px;font-weight:600;color:var(--mute)}.cnt.ok{color:var(--gr)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 16px;font-size:14px;color:var(--mute)}
.bar b{color:var(--tx)}
.tog{background:var(--panel);padding:0 14px;min-height:40px;font-size:13px;font-weight:600;border:2px solid transparent}
.tog.on{border-color:var(--or);color:var(--or)}
pre.raw{white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.4;color:var(--mute);margin:0 0 12px;max-height:340px;overflow:auto;user-select:text;-webkit-user-select:text}
#back,#cfg{position:absolute;top:18px;right:16px;width:48px;height:48px;font-size:24px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
/* camera */
.cam{position:fixed;inset:0;z-index:5;display:block;padding:0;background:#000}
.vf{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);height:100%;width:auto;aspect-ratio:4/3;max-width:100%;background:#111;overflow:hidden;display:grid;place-items:center}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf .lbl{position:absolute;top:10px;left:10px;background:#000a;padding:6px 12px;border-radius:8px;font-weight:700}
.vf .sim{color:#52525b;text-align:center;padding:20px}
.side{position:absolute;top:0;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:84px}
.side:first-child{left:max(12px,env(safe-area-inset-left))}
.side:nth-child(3){right:max(12px,env(safe-area-inset-right))}
.shut{width:76px;height:76px;border-radius:50%;background:#fff;border:6px solid var(--or);display:grid;place-items:center}
.shut svg{width:30px;stroke:#18181b;fill:none;stroke-width:2}
.skip{background:var(--panel);width:76px;font-weight:800}
.x{position:absolute;top:calc(10px + env(safe-area-inset-top,0));right:max(10px,env(safe-area-inset-right));width:48px;background:#000b;font-size:26px;z-index:3}
.lvl{position:absolute;left:12%;right:12%;bottom:14px;height:20px}
.lvl i{position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:#fff}
.lvl b{position:absolute;left:0;right:0;top:9px;height:3px;border-radius:2px;background:#ffffffaa;transition:background .2s}
.lvl.ok b{background:var(--gr)}
.prog{position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:#000a;padding:4px 10px;border-radius:8px;z-index:3}
@media (orientation:portrait){.cam{display:flex;flex-direction:column;justify-content:center;gap:16px;padding:60px 0 24px}.vf{position:relative;top:auto;bottom:auto;left:auto;transform:none;height:auto;width:100%}.side{position:static;flex-direction:row;width:100%;justify-content:space-between;padding:0 16px}.side:first-child,.side:nth-child(3){left:auto;right:auto}}
.mcard{display:block;width:100%;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px;min-height:140px}
.mcard:active{border-color:var(--or)}
.mcard b{display:block;font-size:24px;font-weight:800;margin-bottom:8px}
.mcard small{display:block;color:var(--mute);font-size:15px;line-height:1.4}
.mcard.or{background:#fb923c;border-color:#fb923c;color:#18181b}.mcard.or small{color:#3f2a14}
.seg.big button{min-height:64px;font-size:17px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid div{position:relative;aspect-ratio:4/3;background:var(--panel);border-radius:8px;overflow:hidden}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid span{position:absolute;left:0;right:0;bottom:0;background:#000b;font-size:12px;padding:4px 8px}
.grid .sk{display:grid;place-items:center;color:var(--mute);font-size:13px;border:1px dashed var(--line);background:none}
.grid .sel{outline:3px solid var(--or);outline-offset:-3px}
.grid i{position:absolute;top:6px;left:6px;width:26px;height:26px;border-radius:50%;background:var(--or);color:#18181b;font-style:normal;font-weight:800;display:grid;place-items:center;font-size:14px}
.done{flex:1;display:grid;place-content:center;text-align:center;gap:20px}
.done svg{width:120px;stroke:var(--gr);fill:none;stroke-width:3;filter:drop-shadow(0 0 18px #22c55e99);margin:auto}
.done p{font-size:26px;font-weight:800;margin:0}
</style>
</head>

const MEM=new Map();let idb=null;
function idbOpen(){return new Promise(res=>{try{const r=indexedDB.open('incheck',1);r.onupgradeneeded=()=>r.result.createObjectStore('v',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
const dbReady=idbOpen().then(d=>{idb=d});
async function dbPut(rec){await dbReady;MEM.set(rec.id,rec);if(!idb)return;return new Promise(res=>{try{const tx=idb.transaction('v','readwrite');tx.objectStore('v').put(rec);tx.oncomplete=()=>res();tx.onerror=()=>res();tx.onabort=()=>res()}catch(e){res()}})}
async function dbGet(id){await dbReady;if(!idb)return MEM.get(id)||null;return new Promise(res=>{try{const r=idb.transaction('v').objectStore('v').get(id);r.onsuccess=()=>res(r.result||MEM.get(id)||null);r.onerror=()=>res(MEM.get(id)||null)}catch(e){res(MEM.get(id)||null)}})}

// ---------- gegevensbronnen: 1 Neo, 2 VIN-checker (Vincario), 3 RDW (kenteken). Eerder ingevulde velden worden nooit overschreven.
const put=(c,x,s)=>{if(x==null)return;x=String(x).trim();if(!x||x==='NaN'||S.d[c])return;S.d[c]=x;S.src[c]=s};
const num=(x,f=1)=>{const n=parseFloat(String(x==null?'':x).replace(',','.'));return isFinite(n)&&n>0?String(Math.round(n*f)):''};
const isoD=s=>/^\d{8}$/.test(s||'')?s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6):'';
const TC=s=>String(s||'').toLowerCase().replace(/(^|[\s\-\/])([a-z])/g,(m,a,b)=>a+b.toUpperCase());
const nrm=s=>String(s).toLowerCase().replace(/\([^)]*\)/g,' ').replace(/[^a-z0-9]+/g,' ').trim();
const mapEn=v=>{v=String(v).toLowerCase();return /plug/.test(v)?'Plug-inhybride':/hybrid/.test(v)?'Hybride':/diesel/.test(v)?'Diesel':/petrol|gasoline|benzin/.test(v)?'Benzine':/electric|elektr/.test(v)?'Elektrisch':/cng|natural/.test(v)?'CNG':/lpg/.test(v)?'LPG':/hydrogen|waterstof/.test(v)?'Waterstof':/lng/.test(v)?'LNG':''};
const mapGb=v=>{v=String(v).toLowerCase();return /semi|robot|automated/.test(v)?'Geautomatiseerd handgeschakeld':/manual|hand/.test(v)?'Handgeschakeld':/auto|dsg|cvt|dual/.test(v)?'Automaat':''};
const mapDr=v=>{v=String(v).toLowerCase();return /front|fwd|voor/.test(v)?'Voorwiel':/rear|rwd|achter/.test(v)?'Achterwiel':/4|all|awd|four|vier/.test(v)?'Vierwiel / alle wielen':''};
const COLORS={WIT:'Wit',ZWART:'Zwart',GRIJS:'Grijs',ZILVER:'Zilver',BLAUW:'Blauw',ROOD:'Rood',GROEN:'Groen',GEEL:'Geel',ORANJE:'Oranje',BRUIN:'Bruin'};

// Vincario (alleen voor de test rechtstreeks vanuit de browser; sleutels staan op het toestel, zie Instellingen)
const cfgGet=()=>{try{return Object.assign({api:'',secret:''},JSON.parse(localStorage.getItem('incheck_vincario')||'{}'))}catch(e){return{api:'',secret:''}}};
const cfgSet=(api,secret)=>{try{localStorage.setItem('incheck_vincario',JSON.stringify({api,secret}))}catch(e){}};
async function sha1(s){const b=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function vinRows(vin){
 if(S.cache[vin])return S.cache[vin];
 const K=cfgGet();if(!K.api||!K.secret)return 'nokeys';
 const sum=(await sha1(vin+'|decode|'+K.api+'|'+K.secret)).slice(0,10);
 const r=await fetch('https://api.vincario.com/3.2/'+K.api+'/'+sum+'/decode/'+vin+'.json');
 if(!r.ok)return 'notfound';
 const j=await r.json(),rows=j.decode||[];if(!rows.length)return 'notfound';
 return S.cache[vin]=rows}
// [veldcode, labelvarianten (genormaliseerd), soort]
const VM=[['ID_MAKE',['make'],'s'],['ID_MODEL',['model'],'s'],['ID_TYPE',['vehicle specification'],'s'],['ID_MODELYEAR',['model year'],'n'],
['DIM_LENGTH',['length'],'mm'],['DIM_WIDTH',['width'],'mm'],['DIM_HEIGHT',['height'],'mm'],['DIM_WHEELBASE',['wheelbase array','wheelbase'],'mm'],
['DIM_EMPTY',['weight empty'],'kg'],['DIM_GVW',['max weight','gross vehicle weight'],'kg'],['DIM_TOWUNBRAKED',['permitted trailer load without brakes'],'kg'],['DIM_TOWBRAKED',['permitted trailer load with brakes'],'kg'],
['DIM_SEATS',['number of seats','seats'],'n'],['DIM_DOORS',['number of doors','doors'],'n'],
['ENG_ENERGY',['fuel type primary'],'en'],['ENG_POWER',['engine power','power'],'kw'],['ENG_MODEL',['engine code','engine model'],'s'],['ENG_GEARBOX',['transmission','gearbox'],'gb'],['ENG_GEARS',['number of gears'],'n'],['ENG_DRIVE',['drive'],'dr'],
['ICE_CC',['engine displacement'],'n'],['ICE_CYL',['number of cylinders','cylinders','engine cylinders'],'n'],['ICE_EURO',['emission standard'],'s'],['ICE_TANK',['fuel tank capacity','fuel capacity'],'n']];
const VMM=[['merk',['make'],'s'],['type',['model'],'s'],['bouwjaar',['model year'],'n']];
function applyVin(rows){S.raw.vincario=rows;
 const R=rows.map(r=>({n:nrm(r.label),u:((r.label.match(/\(([^)]*)\)/)||[])[1]||'').toLowerCase(),v:Array.isArray(r.value)?r.value[0]:r.value}));
 const find=al=>{for(const a of al){const m=R.filter(r=>r.n===a&&r.v!=null&&r.v!=='');if(m.length)return m}return[]};
 const K={s:m=>String(m[0].v).trim(),n:m=>num(m[0].v),mm:m=>num(m[0].v,{mm:.1,cm:1,m:100,in:2.54}[m[0].u]||.1),kg:m=>num(m[0].v,{kg:1,lb:.4536,lbs:.4536,t:1000,g:.001}[m[0].u]||1),
  kw:m=>{const k=m.find(x=>x.u==='kw');return k?num(k.v):num(m[0].v,{hp:.7355,ps:.7355,pk:.7355,bhp:.7355}[m[0].u]||1)},en:m=>mapEn(m[0].v),gb:m=>mapGb(m[0].v),dr:m=>mapDr(m[0].v)};
 (S.type==='van'?VM:VMM).forEach(([c,al,k])=>{const m=find(al);if(m.length)put(c,K[k](m),'Vincario')});
 if(S.type==='van'&&!S.d.ID_TYPE&&S.d.ID_MODEL){const p=[S.d.ID_MODEL];if(S.d.ICE_CC)p.push((S.d.ICE_CC/1000).toFixed(1));if(S.d.ENG_POWER)p.push(Math.round(S.d.ENG_POWER*1.36)+' PK');put('ID_TYPE',p.join(' '),'Vincario (voorstel)')}}
// RDW (open data, op kenteken)
async function rdwClient(k){
 const B='https://opendata.rdw.nl/resource/',J=u=>fetch(u).then(r=>{if(!r.ok)throw new Error('RDW '+r.status);return r.json()});
 const [a,f]=await Promise.all([J(B+'m9d7-ebf2.json?kenteken='+k),J(B+'8ys7-d773.json?kenteken='+k).catch(()=>[])]);
 const v=a[0];S.raw.rdw=v||null;S.raw.rdwFuel=f;if(!v)return false;
 const R='RDW';
 put('ID_MAKE',TC(v.merk),R);put('ID_MODEL',TC(v.handelsbenaming),R);put('ID_TYPECODE',v.type,R);put('ID_FIRSTREG',isoD(v.datum_eerste_toelating),R);put('ID_CURCOUNTRY','NL',R);
 put('DIM_COLOR',v.eerste_kleur?COLORS[String(v.eerste_kleur).toUpperCase()]||'Overig':'',R);
 put('DIM_LENGTH',num(v.lengte),R);put('DIM_WIDTH',num(v.breedte),R);put('DIM_HEIGHT',num(v.hoogte_voertuig),R);put('DIM_WHEELBASE',num(v.wielbasis),R);
 put('DIM_EMPTY',num(v.massa_ledig_voertuig),R);put('DIM_GVW',num(v.toegestane_maximum_massa_voertuig),R);put('DIM_GCW',num(v.maximum_massa_samenstelling),R);
 put('DIM_TOWBRAKED',num(v.maximum_trekken_massa_geremd),R);put('DIM_TOWUNBRAKED',num(v.maximum_trekken_massa_ongeremd),R);
 const gvw=+v.toegestane_maximum_massa_voertuig,rk=+v.massa_rijklaar;if(gvw&&rk)put('DIM_PAYLOAD',gvw-rk,'RDW (berekend)');
 put('DIM_SEATS',num(v.aantal_zitplaatsen),R);put('DIM_DOORS',num(v.aantal_deuren),R);put('ICE_CC',num(v.cilinderinhoud),R);put('ICE_CYL',num(v.aantal_cilinders),R);
 put('COND_APK',(v.vervaldatum_apk_dt||'').slice(0,10)||isoD(v.vervaldatum_apk),R);
 const x=f[0];if(x){const names=f.map(y=>y.brandstof_omschrijving);put('ENG_ENERGY',f.length>1&&names.includes('Elektriciteit')?'Hybride':mapEn(x.brandstof_omschrijving),R);
  put('ENG_POWER',num(x.nettomaximumvermogen),R);put('ICE_EURO',x.uitlaatemissieniveau?String(x.uitlaatemissieniveau).replace(/^euro\s*/i,'Euro '):'',R)}
 return true}

let busy=false;
async function autofill(){if(busy)return;busy=true;S.msg='Gegevens ophalen...';const m=$('#msg');if(m)m.textContent=S.msg;
 try{await fill()}catch(e){S.msg='Ophalen mislukt: '+(e.message||e)}
 busy=false;S.vinTried=1;refresh()}
async function fill(){
 const notes=[];S.msg='';
 if(S.type==='van'){
  if(S.id&&!S.neoDone){S.neoDone=1;const r=await neoLookup(S.id);if(r)applyRec(r,'Neo (demo)')}
  const vin=S.d.ID_VIN||'',k=S.d.ID_PLATE||'';
  if(vin.length===17){try{const rows=await vinRows(vin);
    if(rows==='nokeys')notes.push('Zet de Vincario-sleutels aan via het tandwiel op het startscherm.');
    else if(rows==='notfound')notes.push('VIN niet gevonden bij Vincario.');
    else applyVin(rows)}catch(e){notes.push('Vincario niet bereikbaar vanuit de browser ('+(e.message||e)+').')}}
  else if(vin)notes.push('Een VIN heeft 17 tekens.');
  if(k.length>=6){try{if(!(await rdwClient(k)))notes.push('Kenteken niet gevonden bij de RDW.')}catch(e){notes.push('RDW niet bereikbaar.')}}
  if(!vin&&k.length<6)notes.push('Voer het VIN en het kenteken in om meer gegevens op te halen.');
 }else{
  const id=S.d.chassisnummer||'';
  if(id.length===17){try{const rows=await vinRows(id);
    if(rows==='nokeys')notes.push('Zet de Vincario-sleutels aan via het tandwiel op het startscherm.');
    else if(rows==='notfound')notes.push('Chassisnummer niet gevonden bij Vincario.');
    else applyVin(rows)}catch(e){notes.push('Vincario niet bereikbaar vanuit de browser ('+(e.message||e)+').')}}
  else notes.push('Voer het chassisnummer in (17 tekens) om gegevens op te halen.');
 }
 const cnt={};Object.values(S.src).forEach(s=>cnt[s]=(cnt[s]||0)+1);
 const parts=Object.entries(cnt).map(([s,n])=>s+' '+n);
 S.msg=(parts.length?'Ingevuld via '+parts.join(', ')+'. Controleer en vul aan. ':'')+notes.join(' ')}

// ---------- navigatie
function go(s){stopCam();S.step=s;draw()}
function stopCam(){if(S.stream){S.stream.getTracks().forEach(t=>t.stop());S.stream=null}clearInterval(S.lv);window.removeEventListener('devicemotion',S.ori)}
function reqMotion(){try{const D=window.DeviceMotionEvent;if(D&&typeof D.requestPermission==='function')return D.requestPermission().then(r=>{S.motion=r}).catch(()=>{S.motion='denied'});S.motion='granted'}catch(e){S.motion='denied'}return Promise.resolve()}
const tl=p=>p.tilt==null?'':Math.abs(p.tilt)<1.2?' <b style="color:var(--gr)">✓ recht</b>':' <b style="color:var(--or)">'+Math.abs(p.tilt).toFixed(1)+'° scheef</b>';

function scanVin(){
 const ov=document.createElement('div');let r,done=false;
 ov.style.cssText='position:fixed;inset:0;z-index:9;background:#000;display:flex;flex-direction:column';
 ov.innerHTML=`<div style="position:relative;flex:1;overflow:hidden"><video id="sv" playsinline muted style="width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;left:8%;right:8%;top:38%;height:24%;border:3px solid var(--or);border-radius:12px"></div><p id="svm" style="position:absolute;left:16px;right:16px;bottom:16px;margin:0;text-align:center;background:#000b;padding:10px;border-radius:10px">Richt de camera op de barcode van het ${S.type==='van'?'VIN':'chassisnummer'}.</p></div><div class="foot"><button class="cta" id="svx" style="background:var(--panel);color:var(--tx)">ANNULEREN</button></div>`;
 app.appendChild(ov);
 const close=()=>{try{r&&r.reset()}catch(e){}ov.remove()};
 $('#svx').onclick=close;
 const ok=async txt=>{if(done)return;done=true;close();S.d[S.type==='van'?'ID_VIN':'chassisnummer']=txt;delete S.src.ID_VIN;await autofill()};
 const fail=e=>{const m=$('#svm');if(!m)return;m.innerHTML='Camera of scanner niet beschikbaar ('+(e&&e.name||e)+').<br>Typ het nummer in of gebruik de demo.';ov.querySelector('.foot').insertAdjacentHTML('afterbegin','<button class="cta" id="svd" style="margin-bottom:8px">DEMO-WAARDE INVULLEN</button>');$('#svd').onclick=()=>ok(S.type==='van'?'WMA03VUY6P9019536':'CAT0320GC12345')};
 try{
  const Z=window.ZXing,h=new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.DATA_MATRIX,Z.BarcodeFormat.QR_CODE]);h.set(Z.DecodeHintType.TRY_HARDER,true);
  r=new Z.BrowserMultiFormatReader(h);
  r.decodeFromConstraints({video:{facingMode:'environment',width:{ideal:1920}}},'sv',res=>{if(!res)return;const raw=res.getText();if(S.type==='van'){const m=raw.toUpperCase().replace(/[^A-Z0-9]/g,'').match(/[A-HJ-NPR-Z0-9]{17}/);if(m)ok(m[0]);else{const x=$('#svm');if(x)x.textContent='Geen geldig VIN gelezen, probeer opnieuw.'}}else ok(raw.trim())}).catch(fail);
 }catch(e){fail(e)}
}

function draw(){draw0();addBack()}
function draw0(){
 if(S.step==='menu'){
  app.innerHTML=`<div class="scr"><div class="top"><h1>Incheck</h1><button id="cfg" aria-label="Instellingen">⚙︎</button></div><div class="body">
  <button class="mcard or" data-pick="flow:in"><b>Voertuig incheck</b><small>Voor een binnengekomen voertuig: snel foto's maken, VIN-gegevens ophalen en vastleggen of de cabine en stickers schoon zijn.</small></button>
  <button class="mcard" data-pick="flow:ad"><b>Advertentie incheck</b><small>Voor het adverteren: gegevens uit onze database controleren, foto's voor de website kiezen en publiceren.</small></button>
  </div></div>`;
 }
 else if(S.step==='home')app.innerHTML=`<div class="scr"><div class="top"><h1>${S.flow==='in'?'Voertuig incheck':'Advertentie incheck'}</h1><button id="cfg" aria-label="Instellingen">⚙︎</button></div><div class="body"><button class="new" id="new"><span>+</span>NIEUW VOERTUIG</button>${S.flow==='in'?'<div id="dbl"></div>':`<h2 style="margin-top:28px">VORIGE SESSIES</h2>${S.sessions.map((s,n)=>`<button class="card" data-n="${n}"><div class="th" style="${s.photos[0]?`background-image:url(${s.photos[0].url})`:''}">${s.photos[0]?'':s.title.split(' ')[0].slice(0,3)}</div><div><b>${esc(s.title)}</b><small>${esc(s.id)}</small></div></button>`).join('')}`}</div></div>`,
  dbList(),
  $('#new').onclick=()=>{reset();S.sub=0;go('s1')},
  app.querySelectorAll('.card').forEach(c=>c.onclick=()=>{const s=S.sessions[c.dataset.n];Object.assign(S,{type:s.type,sub:s.sub||0,id:s.id,d:{...s.d},src:{...(s.src||{})},raw:{},cache:{},photos:[...s.photos],msg:'',neoDone:1,fromIncheck:s.fromIncheck?1:0,ad:{...(s.ad||{}),fotos:s.ad&&s.ad.fotos?[...s.ad.fotos]:undefined},edit:+c.dataset.n});go('s4')});
 else if(S.step==='cfg'){
  const K=cfgGet(),q=s=>String(s||'').replace(/"/g,'');
  app.innerHTML=`<div class="scr"><div class="top"><h1>Instellingen</h1></div><div class="body"><p class="note">Alleen voor de test: de Vincario-sleutels worden op dit toestel bewaard en staan niet in de pagina of de repository. In de echte app staan ze op de server.</p><div class="row"><label>Vincario API key</label><div class="fld"><input id="k1" autocapitalize="off" autocorrect="off" spellcheck="false" value="${q(K.api)}">${PEN}</div></div><div class="row"><label>Vincario secret key</label><div class="fld"><input id="k2" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" value="${q(K.secret)}">${PEN}</div></div></div><div class="foot"><button class="cta" id="cfgsave">OPSLAAN</button></div></div>`;
  $('#cfgsave').onclick=()=>{cfgSet($('#k1').value.trim(),$('#k2').value.trim());go('menu')};
 }
 else if(S.step==='s1'){
  app.innerHTML=`<div class="scr"><div class="top"><h1>${S.flow==='in'?'Voertuig incheck':'Voertuig vastleggen'}</h1></div><div class="body"><div class="seg"><button data-t="van" class="${S.type==='van'?'on':''}">Van</button><button data-t="machine" class="${S.type==='machine'?'on':''}">Machine</button></div>
  <h2 style="margin:0 0 8px">${S.type==='van'?'BV-nummer':'BM-nummer'}</h2><input class="big" id="id" placeholder="${S.type==='van'?'BV007963':'BM007963'}" value="${esc(S.id)}" autocapitalize="characters" maxlength="8">
  ${S.type==='van'&&S.flow!=='in'?`<h2 style="margin:8px 0 8px">Soort voertuig</h2><select class="big" id="sub1">${SUBS.map((s,i)=>`<option value="${i}"${i===S.sub?' selected':''}>${esc(s.n)}</option>`).join('')}</select>`:''}
  <p class="note">${S.flow==='in'?`Voer het ${S.type==='van'?'BV':'BM'}-nummer in, of laat leeg voor een demo. Daarna maak je snel de foto's (maximaal 9), haal je de VIN-gegevens op (verplicht) en kies je of de cabine en stickers schoon zijn.`:`Voer het ${S.type==='van'?'BV':'BM'}-nummer in, of laat leeg voor een demo. Is het voertuig al ingecheckt, dan worden de gegevens uit de database gehaald (geen VIN-check meer nodig). Anders worden na de fotosessie worden de gegevens eerst uit Neo gehaald en daarna aangevuld met ${S.type==='van'?'de VIN-checker en de RDW':'de VIN-checker'}.`} Probeer BV007941 voor een demo met Neo-gegevens.</p>
  </div>
  <div class="foot"><button class="cta" id="go">${S.flow==='in'?'START FOTO\'S':'START FOTOSESSIE'}</button></div></div>`;
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.type=b.dataset.t;S.d={};S.src={};S.id='';S.fromIncheck=0;draw()});
  $('#id').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');S.id=e.target.value};
  const s1=$('#sub1');if(s1)s1.onchange=e=>{S.sub=+e.target.value};
  $('#go').onclick=async()=>{reqMotion();S.id=(S.id||(S.type==='van'?'BV007963':'BM007963')).toUpperCase();
   if(S.flow==='ad'&&!S.fromIncheck){const rec=await dbGet(S.id);if(rec)applyDbRec(rec)}
   if(S.type==='van'){if(!S.fromIncheck)applySub();S.d.REG_REF=S.id;S.d.REG_DATE=S.d.REG_DATE||today()}S.i=0;S.photos=[];go('cam')};
 }
 else if(S.step==='cam')cam();
 else if(S.step==='s3'){
  app.innerHTML=`<div class="scr"><div class="top"><h1>Foto-overzicht</h1><p class="note" style="margin:6px 0 0">${S.photos.filter(p=>p.url).length} foto's gemaakt, ${S.photos.filter(p=>p.tilt!=null&&Math.abs(p.tilt)<1.2).length} recht</p></div><div class="body"><div class="grid">${S.photos.map(p=>p.url?`<div><img src="${p.url}"><span>${p.label}${tl(p)}</span></div>`:`<div class="sk">${p.label}<br>overgeslagen</div>`).join('')}</div></div>
  <div class="foot"><button class="cta" id="more" style="background:var(--panel);color:var(--tx);margin-bottom:10px">+ EXTRA FOTO</button><button class="cta" id="fin">${S.flow==='in'?'VERDER NAAR VIN-GEGEVENS':'VOLTOOI FOTOSESSIE'}</button></div></div>`;
  $('#more').onclick=()=>{reqMotion();S.i=-1;go('cam')};$('#fin').onclick=()=>go(S.flow==='in'?'vin':'s4');
 }
 else if(S.step==='vin'){
  const van=S.type==='van',key=vinKey(),pl=van?`<h2 style="margin:8px 0 8px">Kenteken (voor de RDW)</h2><input class="big" data-k="ID_PLATE" placeholder="AB123C" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="8" value="${esc(S.d.ID_PLATE||'')}">`:'';
  app.innerHTML=`<div class="scr"><div class="top"><h1>VIN-gegevens</h1></div><div class="body"><p class="note">Verplicht: haal de gegevens van het voertuig nu op, zodat de specificaties al in het systeem staan. Bij het adverteren worden ze uit de database gehaald.</p>
  <h2 style="margin:0 0 8px">${van?'VIN':'Chassisnummer'} (17 tekens)</h2><input class="big" data-k="${key}" placeholder="${van?'WF0XXXTTGXJU12345':'CAT0320GC12345'}" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="17" value="${esc(S.d[key]||'')}">${pl}
  <div class="btns"><button class="cta sm alt" data-scan>SCAN MET CAMERA</button><button class="cta sm" data-lookup>GEGEVENS OPHALEN</button></div><div id="vstat"></div></div>
  <div class="foot"><button class="cta" id="vnext" disabled>VERDER</button></div></div>`;
  vokState();
 }
 else if(S.step==='clean'){
  const ch=(k,l,o)=>`<h2 style="margin:0 0 8px">${l}</h2><div class="seg big" style="margin-bottom:28px">${o.map(x=>`<button data-pick="${k}:${x}" class="${S.clean[k]===x?'on':''}">${x}</button>`).join('')}</div>`;
  app.innerHTML=`<div class="scr"><div class="top"><h1>Cabine en stickers</h1></div><div class="body">${ch('cab','Cabine',['Schoon','Poetsen'])}${ch('stk','Stickers',['Schoon','Ontstickeren'])}</div><div class="foot"><button class="cta" id="cfin"${S.clean.cab&&S.clean.stk?'':' disabled'}>INCHECK AFRONDEN</button></div></div>`;
  $('#cfin').onclick=async()=>{if(!(S.clean.cab&&S.clean.stk))return;
   const rec={id:S.id||'-',type:S.type,sub:S.sub,d:{...S.d},src:{...S.src},photos:S.photos.filter(p=>p.url),clean:{...S.clean},vinOk:vinOk(),at:new Date().toISOString()};
   await dbPut(rec);go('s5')};
 }
 else if(S.step==='s4'){
  app.innerHTML=`<div class="scr"><div class="top"><h1>Gegevens controleren</h1></div><div class="body">${s4body()}</div><div class="foot"><button class="cta" id="ok">BEVESTIG GEGEVENS</button></div></div>`;
  $('#ok').onclick=()=>go('ad');
  if(S.type==='van'&&S.id&&!S.neoDone)autofill();
 }
 else if(S.step==='ad'){
  adscreen();
  $('#fin2').onclick=()=>{const d=S.d,t=(S.type==='van'?`${d.ID_MAKE||'Onbekend'} ${d.ID_MODEL||''}`:`${d.merk||'Onbekend'} ${d.type||''}`).trim(),
   rec={title:t,id:S.id||'-',fromIncheck:S.fromIncheck,type:S.type,sub:S.sub,d:{...d},src:{...S.src},photos:S.photos.filter(p=>p.url),ad:{...S.ad,fotos:(S.ad.fotos||[]).map(n=>S.photos.slice(0,n).filter(p=>p.url).length)}};
   if(S.edit!=null&&S.edit>=0)S.sessions[S.edit]=rec;else S.sessions.unshift(rec);go('s5')};
 }
 else if(S.step==='s5'){
  app.innerHTML=`<div class="done"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 12.5l3.5 3.5L17 9"/></svg><p>${S.flow==='in'?'Incheck afgerond':'Sessie voltooid'}</p>${S.flow==='in'?`<span class="note">${esc(S.id)} · Cabine: ${esc(S.clean.cab||'-')} · Stickers: ${esc(S.clean.stk||'-')}<br>Opgeslagen in de database</span>`:''}</div>`;
  setTimeout(()=>S.step==='s5'&&go('home'),S.flow==='in'?2600:2000);
 }
}

async function cam(){
 const seq=SQ(),extra=S.i===-1,label=extra?'Extra foto':seq[S.i];
 app.innerHTML=`<div class="cam"><div class="side">${extra?'':'<button class="skip" id="prev" aria-label="Vorige foto">←</button>'}<button class="skip" id="skip">${extra?'TERUG':'SKIP'}</button></div><div class="vf" id="vf"><video id="v" playsinline muted autoplay></video><div class="sim" id="sim">Camera niet beschikbaar in deze preview.<br>De sluiter maakt een demo-foto.</div><div class="lbl">${label}</div>${typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission&&S.motion!=='granted'?'<button id="mot" class="cta" style="position:absolute;left:12%;right:12%;bottom:44px;min-height:44px;width:auto;font-size:14px">WATERPAS ACTIVEREN</button>':''}<div class="lvl" id="lvl"><span id="lst" style="position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:12px;background:#000a;padding:2px 8px;border-radius:6px;white-space:nowrap"></span><i></i><b id="lb"></b></div></div><div class="side"><button class="shut" id="shut" aria-label="Foto maken"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button></div><button class="x" id="x">✕</button>${extra?'':`<div class="prog">${S.i+1} / ${seq.length}</div>`}</div>`;
 const v=$('#v');
 try{S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1440}},audio:false});v.srcObject=S.stream;$('#sim').style.display='none'}catch(e){v.style.display='none';$('#sim').innerHTML='Camera geblokkeerd ('+(e.name||e)+').<br>De sluiter maakt een demo-foto.'}
 let ang=null,pit=false;S.ori=e=>{const g=e.accelerationIncludingGravity;if(!g||g.x==null||g.y==null)return;S.live=Date.now();const n=Math.hypot(g.x,g.y,g.z||0)||1;pit=Math.abs((g.z||0)/n)>.5;const a0=Math.atan2(g.x,g.y)*180/Math.PI;ang=a0-Math.round(a0/90)*90};
 window.addEventListener('devicemotion',S.ori);$('#lvl').onclick=()=>{S.flip=!S.flip};const mb=$('#mot');if(mb)mb.onclick=async()=>{await reqMotion();mb.remove()};
 let t=0;S.lv=setInterval(()=>{t+=.1;const live=S.live&&Date.now()-S.live<500,a=live?(ang||0)*(S.flip?-1:1):Math.sin(t*.7)*6*Math.max(0,1-(t%12)/10);S.tilt=live&&!pit?a:null;
  $('#lb').style.transform=`rotate(${Math.max(-12,Math.min(12,a))}deg)`;$('#lb').style.opacity=live&&pit?.3:1;$('#lvl').classList.toggle('ok',!!live&&!pit&&Math.abs(a)<1.2);const st=$('#lst');if(st)st.textContent=!live?'geen sensor':pit?'houd horizontaal':(Math.abs(a)<1.2?'recht':a.toFixed(1)+'°')},60);
 $('#x').onclick=()=>{if(confirm('Sessie annuleren? Gemaakte foto\'s gaan verloren.'))go('home')};
 const next=p=>{if(extra){S.photos.push(p);go('s3');return}S.photos.push(p);S.i++;S.i>=seq.length?go('s3'):cam()};
 $('#skip').onclick=()=>extra?go('s3'):(stopCam(),next({label}));
 const pv=$('#prev');if(pv)pv.onclick=()=>{stopCam();if(S.i===0)go('s1');else{S.i--;S.photos.pop();cam()}};
 $('#shut').onclick=()=>{const c=document.createElement('canvas');c.width=1600;c.height=1200;const g=c.getContext('2d');
  if(S.stream&&v.videoWidth){const vw=v.videoWidth,vh=v.videoHeight,w=Math.min(vw,vh*4/3),h=w*3/4;g.drawImage(v,(vw-w)/2,(vh-h)/2,w,h,0,0,1600,1200)}
  else{g.fillStyle=`hsl(${S.photos.length*37%360} 12% 22%)`;g.fillRect(0,0,1600,1200);g.fillStyle='#fff8';g.font='bold 80px sans-serif';g.textAlign='center';g.fillText(label,800,620)}
  const url=c.toDataURL('image/jpeg',.8),tilt=S.tilt;stopCam();next({label,url,tilt})};
}
const BACK={
 home:()=>go('menu'),
 s1:()=>go('home'),
 vin:()=>go('s3'),
 clean:()=>go('vin'),
 s3:()=>{const n=SQ().length;S.photos.pop();S.i=S.photos.length>=n?-1:S.photos.length;go('cam')},
 s4:()=>go('s3'),
 ad:()=>go('s4'),
 cfg:()=>go('menu')
};
function addBack(){const t=app.querySelector('.top'),f=BACK[S.step];if(!t||!f)return;t.insertAdjacentHTML('beforeend','<button id="back" aria-label="Terug">←</button>');$('#back').onclick=f}
draw();
</script>
</body>
